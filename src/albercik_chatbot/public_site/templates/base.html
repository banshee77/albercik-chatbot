<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ALBERTOS — Tradycyjne Karate-Do{% endblock %}</title>
  <meta name="description" content="{% block description %}ALBERTOS — klub tradycyjnego karate-do. Treningi dla dzieci, młodzieży i dorosłych.{% endblock %}">
  <link rel="stylesheet" href="/static/site/css/site.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip-link" href="#main-content">Przejdź do treści</a>

  <header class="site-header">
    <div class="site-header__bar">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" focusable="false">
            <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.5"/>
          </svg>
        </span>
        <span class="brand__name">ALBERTOS</span>
      </a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="primary-nav">
        <span class="visually-hidden">Menu</span>
        <span class="nav-toggle__bars" aria-hidden="true"></span>
      </button>
    </div>
    <nav id="primary-nav" class="primary-nav" aria-label="Główna nawigacja">
      <ul>
        {% for href, label in nav_items %}
        <li><a href="{{ href }}"{% if request.url.path == href %} aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; ALBERTOS — Akademia Tradycyjnego Karate-Do.</p>
      <p><a href="/kontakt">Skontaktuj się z nami</a></p>
    </div>
  </footer>

  <script src="/static/site/js/site.js" defer></script>
</body>
</html>

[project]
name = "shiruno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Banshee77", email = "banshee77@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.122.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2",
    "torch>=2.0.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
shiruno = "shiruno:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

# CPU-only torch: research.md §4a / tasks.md T002 require no GPU dependency
# for the MVP. sentence-transformers pulls torch in transitively; without
# this override uv resolves the default (CUDA-bundled) torch wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".specify", ".claude", "specs", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic dependency-injection pattern is `Depends(...)` as an
# argument default — not the mutable-default-argument footgun B008 guards
# against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test code is exempt from strict typing (fixtures, monkeypatch, fakes) —
# Principle XII scopes "type hints throughout" to application code.
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

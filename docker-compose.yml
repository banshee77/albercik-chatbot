services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: albercik
      POSTGRES_PASSWORD: albercik
      POSTGRES_DB: albercik
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albercik -d albercik"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ephemeral database for the integration test suite (research.md §8).
  # No volume: state resets on every `down`/`up`.
  db-test:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: albercik
      POSTGRES_PASSWORD: albercik
      POSTGRES_DB: albercik_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albercik -d albercik_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single application service. Embeddings run in-process via
  # sentence-transformers (research.md §4/§4a) — there is deliberately no
  # separate embedding-service container.
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://albercik:albercik@db:5432/albercik
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: albercik
      POSTGRES_PASSWORD: albercik
      POSTGRES_DB: albercik
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albercik -d albercik"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ephemeral database for the integration test suite (research.md §8).
  # No volume: state resets on every `down`/`up`.
  db-test:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: albercik
      POSTGRES_PASSWORD: albercik
      POSTGRES_DB: albercik_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albercik -d albercik_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM backend (feature 002-add-ollama-provider, research.md §6).
  # Deliberately NO `ports:` mapping — reachable only over this internal
  # Compose network, at http://ollama:11434 (the OLLAMA_BASE_URL default),
  # never exposed to the host or the public internet (spec FR-008). Part
  # of the default `docker compose up` set, not gated behind a profile:
  # LLM_PROVIDER defaults to `ollama`, so a plain `docker compose up -d`
  # must actually have a working backend to talk to. The configured model
  # is provisioned automatically by the `ollama-init` service below — no
  # manual `ollama pull` command required (research.md §6a). To use a
  # host-run Ollama instance instead, leave this service running unused
  # and point OLLAMA_BASE_URL at the host (e.g.
  # http://host.docker.internal:11434 on Docker Desktop/WSL2).
  #
  # GPU passthrough (feature 003-ollama-gpu-acceleration, research.md §1-§3):
  # NVIDIA GPU access is requested for this service only, via Compose's
  # native (non-Swarm) `deploy.resources.reservations.devices` mechanism —
  # never `ollama-init` or `app`, which never run inference. On a host
  # without a working NVIDIA driver/Container Toolkit, `docker compose up`
  # will fail to start this service; comment out or remove the `deploy`
  # block below to run CPU-only (spec FR-016/FR-017 — deliberately manual,
  # no auto-detection).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot model provisioning (feature 002-add-ollama-provider User Story
  # 4, research.md §6a). Reuses the `ollama` image's own CLI rather than a
  # separate image; `restart: "no"` and `depends_on: ollama:
  # service_healthy` + `app`'s `depends_on: ollama-init:
  # service_completed_successfully` together give "run once, then never
  # again unless explicitly re-run" and "app never starts until the model
  # is ready" for free from Compose's own primitives. `ollama pull` is
  # natively idempotent, so a restart with the model already present in
  # the `ollama-data` volume completes almost immediately rather than
  # re-downloading. Skips the pull entirely (exit 0, no network call) when
  # LLM_PROVIDER isn't `ollama`, so an Anthropic-only deployment is never
  # forced to download a local model just to start.
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$$LLM_PROVIDER" != "ollama" ]; then
          echo "LLM_PROVIDER=$$LLM_PROVIDER — skipping Ollama model provisioning."
          exit 0
        fi
        echo "Ensuring Ollama model '$$OLLAMA_MODEL' is available..."
        exec ollama pull "$$OLLAMA_MODEL"

  # Single application service. Embeddings run in-process via
  # sentence-transformers (research.md §4/§4a) — there is deliberately no
  # separate embedding-service container.
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://albercik:albercik@db:5432/albercik
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  db-data:
  ollama-data:
